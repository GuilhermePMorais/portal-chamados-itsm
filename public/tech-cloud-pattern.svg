<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" fill="none" stroke="#334155" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.14">
  <!-- IT & Cloud Infrastructure Doodle Pattern (WhatsApp Wallpaper Style) -->
  
  <!-- Nuvem de Servidores / Cloud Server (topo-esquerda) -->
  <g transform="translate(30, 25)">
    <path d="M12 28a10 10 0 0 1 18-5 12 12 0 0 1 22 4 8 8 0 0 1-2 16H14a9 9 0 0 1-2-15z" />
    <line x1="26" y1="34" x2="38" y2="34" />
    <circle cx="21" cy="34" r="1.5" fill="#334155" />
    <circle cx="43" cy="34" r="1.5" fill="#334155" />
  </g>

  <!-- Terminal / Command Prompt (topo-centro) -->
  <g transform="translate(150, 25)">
    <rect x="0" y="0" width="46" height="34" rx="4" />
    <line x1="0" y1="10" x2="46" y2="10" />
    <circle cx="6" cy="5" r="1" fill="#334155" />
    <circle cx="12" cy="5" r="1" fill="#334155" />
    <circle cx="18" cy="5" r="1" fill="#334155" />
    <path d="M8 18l5 4-5 4" />
    <line x1="16" y1="26" x2="26" y2="26" />
  </g>

  <!-- Roteador Wi-Fi / Router (topo-direita) -->
  <g transform="translate(270, 25)">
    <rect x="6" y="16" width="44" height="18" rx="4" />
    <line x1="16" y1="6" x2="16" y2="16" />
    <line x1="40" y1="6" x2="40" y2="16" />
    <circle cx="16" cy="5" r="1.5" fill="#334155" />
    <circle cx="40" cy="5" r="1.5" fill="#334155" />
    <circle cx="16" cy="25" r="1.5" fill="#334155" />
    <circle cx="24" cy="25" r="1.5" fill="#334155" />
    <circle cx="32" cy="25" r="1.5" fill="#334155" />
    <circle cx="40" cy="25" r="1.5" fill="#334155" />
  </g>

  <!-- Escudo de Cibersegurança / Security Shield (esquerda-meio) -->
  <g transform="translate(35, 120)">
    <path d="M22 6s14-6 22-6 22 6 22 6v18c0 14-12 24-22 28-10-4-22-14-22-28V6z" />
    <path d="M36 24l6 6 12-12" />
  </g>

  <!-- Rack de Servidores / Server Blade (centro-meio) -->
  <g transform="translate(155, 115)">
    <rect x="0" y="0" width="48" height="60" rx="4" />
    <line x1="0" y1="15" x2="48" y2="15" />
    <line x1="0" y1="30" x2="48" y2="30" />
    <line x1="0" y1="45" x2="48" y2="45" />
    <!-- LEDs -->
    <circle cx="8" cy="8" r="1.5" fill="#334155" />
    <circle cx="14" cy="8" r="1.5" fill="#334155" />
    <line x1="24" y1="8" x2="40" y2="8" />
    <circle cx="8" cy="23" r="1.5" fill="#334155" />
    <circle cx="14" cy="23" r="1.5" fill="#334155" />
    <line x1="24" y1="23" x2="40" y2="23" />
    <circle cx="8" cy="38" r="1.5" fill="#334155" />
    <circle cx="14" cy="38" r="1.5" fill="#334155" />
    <line x1="24" y1="38" x2="40" y2="38" />
    <circle cx="8" cy="53" r="1.5" fill="#334155" />
    <circle cx="14" cy="53" r="1.5" fill="#334155" />
    <line x1="24" y1="53" x2="40" y2="53" />
  </g>

  <!-- Conector RJ45 / Cabo de Rede Ethernet (direita-meio) -->
  <g transform="translate(280, 120)">
    <rect x="10" y="10" width="28" height="34" rx="3" />
    <path d="M18 10V4h12v6" />
    <line x1="16" y1="24" x2="16" y2="38" />
    <line x1="20" y1="24" x2="20" y2="38" />
    <line x1="24" y1="24" x2="24" y2="38" />
    <line x1="28" y1="24" x2="28" y2="38" />
    <line x1="32" y1="24" x2="32" y2="38" />
    <!-- Cabo descendo -->
    <path d="M24 44v14c0 4-4 8-8 8H6" />
  </g>

  <!-- Banco de Dados / Database Cylinder (inferior-esquerda) -->
  <g transform="translate(35, 230)">
    <ellipse cx="24" cy="12" rx="20" ry="7" />
    <path d="M4 12v14c0 4 9 7 20 7s20-3 20-7V12" />
    <path d="M4 26v14c0 4 9 7 20 7s20-3 20-7V26" />
  </g>

  <!-- Chamado / Ticket ITSM com Check (inferior-centro) -->
  <g transform="translate(155, 235)">
    <rect x="4" y="6" width="40" height="48" rx="4" />
    <line x1="12" y1="16" x2="24" y2="16" />
    <line x1="12" y1="24" x2="36" y2="24" />
    <line x1="12" y1="32" x2="32" y2="32" />
    <line x1="12" y1="40" x2="20" y2="40" />
    <!-- Carimbo de prioridade / estrela -->
    <circle cx="34" cy="40" r="4" />
    <path d="M32 40l1.5 1.5 3-3" />
  </g>

  <!-- Microprocessador / CPU Chip (inferior-direita) -->
  <g transform="translate(280, 230)">
    <rect x="10" y="10" width="30" height="30" rx="3" />
    <rect x="17" y="17" width="16" height="16" rx="2" />
    <!-- Pinos superiores -->
    <line x1="16" y1="5" x2="16" y2="10" />
    <line x1="25" y1="5" x2="25" y2="10" />
    <line x1="34" y1="5" x2="34" y2="10" />
    <!-- Pinos inferiores -->
    <line x1="16" y1="40" x2="16" y2="45" />
    <line x1="25" y1="40" x2="25" y2="45" />
    <line x1="34" y1="40" x2="34" y2="45" />
    <!-- Pinos esquerda -->
    <line x1="5" y1="16" x2="10" y2="16" />
    <line x1="5" y1="25" x2="10" y2="25" />
    <line x1="5" y1="34" x2="10" y2="34" />
    <!-- Pinos direita -->
    <line x1="40" y1="16" x2="45" y2="16" />
    <line x1="40" y1="25" x2="45" y2="25" />
    <line x1="40" y1="34" x2="45" y2="34" />
  </g>

  <!-- Elementos de Ligação / Conectores de Rede Flutuantes -->
  <!-- Chave de Fenda & Manutenção -->
  <g transform="translate(100, 75)">
    <path d="M4 22l14-14M14 4l6 6-3 3-6-6 3-3z" />
    <circle cx="2" cy="24" r="1.5" />
  </g>

  <!-- Cadeado / Security Lock -->
  <g transform="translate(230, 75)">
    <rect x="4" y="9" width="18" height="15" rx="3" />
    <path d="M8 9V6a5 5 0 0 1 10 0v3" />
    <circle cx="13" cy="16" r="1.5" fill="#334155" />
  </g>

  <!-- Nó de Rede / Network Mesh Node -->
  <g transform="translate(100, 185)">
    <circle cx="10" cy="10" r="5" />
    <circle cx="28" cy="22" r="4" />
    <circle cx="6" cy="32" r="3" />
    <line x1="14" y1="12" x2="24" y2="20" />
    <line x1="9" y1="15" x2="7" y2="29" />
  </g>

  <!-- Ondas Wi-Fi / Sinal -->
  <g transform="translate(235, 185)">
    <path d="M4 20a16 16 0 0 1 24 0" />
    <path d="M8 24a10 10 0 0 1 16 0" />
    <circle cx="16" cy="28" r="2" fill="#334155" />
  </g>

  <!-- Linhas e nós conectores sutis distribuídos -->
  <circle cx="95" cy="315" r="2" fill="#334155" />
  <circle cx="245" cy="315" r="2" fill="#334155" />
  <path d="M95 315h60M195 315h50" stroke-dasharray="3 3" />
</svg>
